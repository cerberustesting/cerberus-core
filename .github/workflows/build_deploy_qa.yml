# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Deploy to QA

on:
  push:
    branches: [ master ]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:
  # temporary disabled due to qa deployements during unmerged pull requests
  # pull_request:
  #  branches: [ master ]

# One run at a time: the GitHub release tag is moved on every run.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:

  build:
    name: build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.getVersion.outputs.version }}
    steps:
    - name: Public IP
      id: ip
      run: |
        echo "ipv4=$(curl -s https://api.ipify.org)" >> "$GITHUB_OUTPUT"
        echo "ipv6=$(curl -s https://api64.ipify.org)" >> "$GITHUB_OUTPUT"
    - name: Print Public IP
      run: |
        echo ${{ steps.ip.outputs.ipv4 }}
        echo ${{ steps.ip.outputs.ipv6 }}
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Set up Maven 3.9.14
      # Maven 3.10.0 (installed on the ubuntu-latest runners) resolves the dependencies of this project differently:
      # it leaves the transitive dependencies of selenium-remote-driver (failsafe, netty, opentelemetry,
      # async-http-client...) out of the WAR, without any error. We keep the version the project is known to build with.
      run: |
        maven_version=3.9.14
        curl -sSL "https://archive.apache.org/dist/maven/maven-3/${maven_version}/binaries/apache-maven-${maven_version}-bin.tar.gz" -o "$RUNNER_TEMP/maven.tar.gz"
        curl -sSL "https://archive.apache.org/dist/maven/maven-3/${maven_version}/binaries/apache-maven-${maven_version}-bin.tar.gz.sha512" -o "$RUNNER_TEMP/maven.tar.gz.sha512"
        echo "$(cat "$RUNNER_TEMP/maven.tar.gz.sha512")  $RUNNER_TEMP/maven.tar.gz" | sha512sum -c -
        tar xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/apache-maven-${maven_version}/bin" >> "$GITHUB_PATH"
    - name: Get Project Version from pom.xml
      id: getVersion
      run: |
        cd source
        version=$(mvn --batch-mode -q -DforceStdout help:evaluate -Dexpression=project.version)
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "The version we just got is $version"
    - name: Build with Maven
      run: |
        cd source
        mvn --batch-mode -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn clean install --file pom.xml 
    - name: Check the WAR dependencies
      # The transitive dependencies of selenium-remote-driver (failsafe, netty, opentelemetry...) were once left
      # out of the WAR without any build error, which broke every Selenium execution at runtime.
      # We print what Maven resolves and refuse to deliver a WAR that misses them.
      run: |
        cd source
        mvn -v
        mvn --batch-mode dependency:tree -Dincludes=io.netty:netty-common,dev.failsafe:failsafe,io.opentelemetry:opentelemetry-api,org.asynchttpclient:async-http-client,org.seleniumhq.selenium:selenium-remote-driver || true
        war=$(ls target/cerberus-core-*.war | head -1)
        echo "WAR: $war - $(unzip -Z1 "$war" | grep -c '^WEB-INF/lib/.*\.jar$') jar(s) in WEB-INF/lib"
        missing=0
        for jar in failsafe netty-common netty-handler opentelemetry-api async-http-client selenium-remote-driver; do
          if ! unzip -Z1 "$war" | grep -q "^WEB-INF/lib/$jar-"; then
            echo "::error::$jar is missing from WEB-INF/lib of $war"
            missing=1
          fi
        done
        exit $missing
    - name: Push file to core VM
      env:
        source-war: 'target/*.war'
        source-zip: 'target/*.zip'
        destination: 'debian@vm.cerberus-testing.org:/opt/delivery/'  
      run: |
        cd source
        echo "${{secrets.DEPLOY_KEY}}" > deploy_key
        chmod 600 ./deploy_key
        sudo rsync -chav \
          -e 'ssh -i ./deploy_key -o StrictHostKeyChecking=no' \
          ${{env.source-war}} ${{env.destination}}
        sudo rsync -chav \
          -e 'ssh -i ./deploy_key -o StrictHostKeyChecking=no' \
          ${{env.source-zip}} ${{env.destination}}
    - name: Deploy to QA
      run: |
        cd source
        echo "${{secrets.DEPLOY_KEY}}" > deploy_key
        chmod 600 ./deploy_key
        ssh  -i ./deploy_key -o StrictHostKeyChecking=no debian@vm.cerberus-testing.org "/opt/bin/deployQA.sh /opt/delivery/`find -type f -name cerberus-core*war | sed 's/.\/target\///g'`"
    - name: Push files to Github Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        git config --local user.email "github-actions@github.com"
        git config --local user.name "github-actions"
        VERSION="v${{ steps.getVersion.outputs.version }}"

        git tag -f -a "$VERSION" -m "Release $VERSION."
        git push -f origin "$VERSION"

        if ! gh release view "$VERSION" >/dev/null 2>&1; then
          if [[ "$VERSION" == *"-SNAPSHOT" ]]; then
            echo "Creating prerelease $VERSION"
            gh release create "$VERSION" --title "$VERSION" --prerelease
          else
            echo "Creating release $VERSION"
            gh release create "$VERSION" --title "$VERSION"
          fi
        fi

        gh release upload "$VERSION" source/target/cerberus-core-*.war source/target/cerberus-core-*.zip --clobber
    - name: Keep the zip for the Docker image
      uses: actions/upload-artifact@v4
      with:
        name: cerberus-zip
        path: source/target/cerberus-core-${{ steps.getVersion.outputs.version }}.zip
        retention-days: 1

  docker:
    name: Docker Build & Push (${{ matrix.image }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cerberus-as-tomcat
            auth_mode: local
          - image: cerberus-as-tomcat-keycloak
            auth_mode: keycloak
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Get the zip built by the build job
        uses: actions/download-artifact@v4
        with:
          name: cerberus-zip
          path: source/target

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Define tags
        id: tags
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          IMAGE=cerberustesting/${{ matrix.image }}
          TAGS="$IMAGE:$VERSION"
          # latest only follows real releases, never a snapshot
          if [[ "$VERSION" != *"-SNAPSHOT" ]]; then
            TAGS="$TAGS,$IMAGE:latest"
          fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: source
          file: source/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            CERBERUS_VERSION=${{ needs.build.outputs.version }}
            AUTH_MODE=${{ matrix.auth_mode }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          tags: ${{ steps.tags.outputs.tags }}
