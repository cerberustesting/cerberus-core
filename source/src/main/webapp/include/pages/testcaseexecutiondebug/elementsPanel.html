<!-- TestCaseDebug V2 - Elements panel : interactive/notable elements detected in the current
     page source (see pageSourcePanel.html), each with a short description and an XPath locator.
     Extraction is deterministic (Jsoup, no AI call) and runs automatically on every new page
     source capture — this panel's own button is just a manual re-run. -->

<div class="flex flex-col rounded-2xl v2-fade-in overflow-hidden"
     style="background: var(--crb-new-bg); border: 1px solid var(--crb-grey-light-color)">

    <div class="flex items-center justify-between px-4 py-2.5 shrink-0"
         style="border-bottom: 1px solid var(--crb-grey-light-color)">
        <div class="flex items-center gap-2">
            <i data-lucide="scan-search" class="w-4 h-4" style="color: var(--crb-grey-color)"></i>
            <span class="text-[11px] font-bold uppercase tracking-wider" style="color: var(--crb-dark-color)">Elements</span>
            <span class="text-[10px] opacity-50" x-show="elements.length > 0" x-text="elements.length"></span>
        </div>
        <template x-if="pageSourceContent">
            <button @click="extractElements()"
                    :disabled="elementsLoading"
                    class="h-7 w-7 rounded-lg flex items-center justify-center text-slate-400 hover:text-blue-600 hover:bg-slate-100 dark:hover:bg-slate-800 transition disabled:opacity-40"
                    data-tip="Re-run element extraction on this page source">
                <i data-lucide="loader-2" class="w-3.5 h-3.5 v2-exe-spin-limited" x-show="elementsLoading"></i>
                <i data-lucide="refresh-cw" class="w-3.5 h-3.5" x-show="!elementsLoading"></i>
            </button>
        </template>
    </div>

    <div class="flex-1 overflow-y-auto px-2 py-1.5" style="max-height: calc(100vh - 720px); min-height: 100px">

        <template x-if="elementsError">
            <div class="px-2 py-2 text-[12px]" style="color: var(--crb-red-color)" x-text="elementsError"></div>
        </template>

        <template x-if="!elementsError && elementsLoading && elements.length === 0">
            <div class="flex items-center justify-center gap-2 py-6 text-[11px]" style="color: var(--crb-grey-color)">
                <i data-lucide="loader-2" class="w-3.5 h-3.5 v2-exe-spin-limited"></i>
                Analyzing page source...
            </div>
        </template>

        <template x-if="!elementsLoading && !elementsError && elements.length === 0">
            <div class="flex flex-col items-center justify-center py-6 gap-2 text-center px-4">
                <i data-lucide="scan-search" class="w-6 h-6" style="color: var(--crb-grey-color)"></i>
                <span class="text-[12px]" style="color: var(--crb-grey-color)">No elements detected yet</span>
            </div>
        </template>

        <template x-for="(el, idx) in elements" :key="idx">
            <div class="rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800/60 transition-colors">
                <div class="group flex items-center gap-1 px-2 py-1.5">
                    <div class="flex-1 min-w-0">
                        <div class="text-[12px] font-medium truncate" style="color: var(--crb-dark-color)" x-text="el.description"></div>
                        <code class="text-[10px] truncate block" style="color: var(--crb-grey-color)" x-text="el.xpath"></code>
                    </div>

                    <!-- ApplicationObject count (click to view/edit/delete) or create -->
                    <template x-if="aosForXpath(el.xpath).length > 0">
                        <button @click="toggleAoExpand(el)"
                                class="shrink-0 h-6 min-w-[22px] px-1.5 rounded-full flex items-center justify-center text-[10px] font-bold transition"
                                style="background: color-mix(in srgb, var(--crb-blue-color) 15%, transparent); color: var(--crb-blue-color)"
                                :data-tip="aosForXpath(el.xpath).length + ' ApplicationObject(s) for this xpath — click to view/edit/delete'">
                            <span x-text="aosForXpath(el.xpath).length"></span>
                        </button>
                    </template>
                    <template x-if="aosForXpath(el.xpath).length === 0">
                        <button @click="addApplicationObject(el)"
                                class="shrink-0 h-7 w-7 rounded-md flex items-center justify-center text-slate-400 hover:text-blue-600 hover:bg-slate-200 dark:hover:bg-slate-700 transition"
                                data-tip="Create an ApplicationObject from this element">
                            <i data-lucide="plus" class="w-3.5 h-3.5"></i>
                        </button>
                    </template>

                    <!-- Highlight in the live page -->
                    <button @click="highlightElement(el)"
                            :disabled="el._highlighting"
                            class="shrink-0 h-7 w-7 rounded-md flex items-center justify-center text-slate-400 hover:text-amber-600 hover:bg-slate-200 dark:hover:bg-slate-700 transition disabled:opacity-40"
                            data-tip="Highlight this element on the live page">
                        <i data-lucide="loader-2" class="w-3.5 h-3.5 v2-exe-spin-limited" x-show="el._highlighting"></i>
                        <i data-lucide="crosshair" class="w-3.5 h-3.5" x-show="!el._highlighting"></i>
                    </button>

                    <!-- Copy xpath=... -->
                    <button @click="copyXpath(el)"
                            class="shrink-0 h-7 w-7 rounded-md flex items-center justify-center text-slate-400 hover:text-blue-600 hover:bg-slate-200 dark:hover:bg-slate-700 transition"
                            data-tip="Copy xpath=...">
                        <i data-lucide="copy" class="w-3.5 h-3.5" x-show="!el._copied"></i>
                        <i data-lucide="check" class="w-3.5 h-3.5" x-show="el._copied" style="color: var(--crb-green-color, #22c55e)"></i>
                    </button>
                </div>

                <!-- Matching ApplicationObjects, expanded -->
                <template x-if="el._aoExpanded">
                    <div class="pl-2 pb-1.5 pr-2 space-y-1">
                        <template x-for="ao in aosForXpath(el.xpath)" :key="ao.object">
                            <div class="flex items-center gap-2 px-2 py-1 rounded-lg" style="background: color-mix(in srgb, var(--crb-blue-color) 6%, transparent)">
                                <span class="text-[11px] flex-1 truncate" style="color: var(--crb-dark-color)" x-text="ao.object"></span>
                                <button @click="editApplicationObject(ao)"
                                        class="shrink-0 h-5 w-5 rounded flex items-center justify-center text-slate-400 hover:text-blue-600 transition"
                                        data-tip="Edit">
                                    <i data-lucide="pencil" class="w-3 h-3"></i>
                                </button>
                                <button @click="deleteApplicationObject(ao)"
                                        class="shrink-0 h-5 w-5 rounded flex items-center justify-center text-slate-400 hover:text-red-600 transition"
                                        data-tip="Delete">
                                    <i data-lucide="trash-2" class="w-3 h-3"></i>
                                </button>
                            </div>
                        </template>
                        <button @click="addApplicationObject(el)"
                                class="flex items-center gap-1 pl-2 text-[10px] font-medium text-slate-400 hover:text-blue-600 transition">
                            <i data-lucide="plus" class="w-3 h-3"></i>
                            Add another
                        </button>
                    </div>
                </template>
            </div>
        </template>
    </div>
</div>
