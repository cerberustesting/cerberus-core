<!-- TestCaseDebug V2 - Control Bar -->

<div id="v2DbgHeader" class="v2-fade-in rounded-2xl mb-3 px-4 py-3 flex items-center gap-4"
     style="background: var(--crb-new-bg); border: 1px solid var(--crb-grey-light-color)">

    <!-- Identity -->
    <div class="flex items-center gap-3 min-w-0 shrink-0">
        <div class="h-10 w-10 rounded-xl flex items-center justify-center shrink-0"
             style="background: color-mix(in srgb, var(--crb-blue-color) 12%, transparent)">
            <i data-lucide="bug" class="w-5 h-5" style="color: var(--crb-blue-color)"></i>
        </div>
        <div class="min-w-0">
            <div class="text-sm font-semibold truncate" style="color: var(--crb-dark-color)"
                 x-text="(exe.test || '') + ' / ' + (exe.testcase || exe.testCase || '')"></div>
            <div class="text-[11px] truncate" style="color: var(--crb-grey-color)"
                 x-text="(exe.country || '') + ' - ' + (exe.environment || '') + (exe.robot ? (' - ' + exe.robot) : '')"></div>
        </div>
    </div>

    <!-- Auto-run in progress : takes priority over the plain pending/running banners -->
    <template x-if="autoRunning">
        <div class="flex-1 min-w-0 flex items-center gap-2 px-3 py-2 rounded-xl"
             style="background: color-mix(in srgb, #f59e0b 10%, transparent); border: 1px solid color-mix(in srgb, #f59e0b 25%, transparent)">
            <i data-lucide="fast-forward" class="w-4 h-4 shrink-0 v2-exe-spin-limited" style="color: #f59e0b"></i>
            <span class="text-[12px] truncate flex-1" style="color: #f59e0b">Exécution automatique en cours...</span>
            <button @click="cancelAutoRun()"
                    class="shrink-0 h-6 px-2.5 rounded-lg text-[11px] font-semibold transition"
                    style="background: color-mix(in srgb, #f59e0b 18%, transparent); color: #f59e0b">
                Annuler
            </button>
        </div>
    </template>

    <!-- Failed : offers retry, distinct from the plain "up next" banner -->
    <template x-if="!autoRunning && isWaitingForNext && status.pendingFailed">
        <div class="flex-1 min-w-0 flex items-center gap-2 px-3 py-2 rounded-xl v2-debug-pending"
             style="background: color-mix(in srgb, var(--crb-red-color) 8%, transparent); border: 1px solid color-mix(in srgb, var(--crb-red-color) 25%, transparent)">
            <i data-lucide="alert-triangle" class="w-4 h-4 shrink-0" style="color: var(--crb-red-color)"></i>
            <span class="text-[12px] truncate" style="color: var(--crb-red-color)"
                  x-text="'Failed: ' + (status.pendingControlDescription || status.pendingActionDescription || 'action') + ' — retry, or Next to accept and continue'"></span>
        </div>
    </template>

    <!-- Pending action banner -->
    <template x-if="!autoRunning && isWaitingForNext && !status.pendingFailed">
        <div class="flex-1 min-w-0 flex items-center gap-2 px-3 py-2 rounded-xl v2-debug-pending"
             style="background: color-mix(in srgb, var(--crb-blue-color) 8%, transparent); border: 1px solid color-mix(in srgb, var(--crb-blue-color) 25%, transparent)">
            <i data-lucide="hand" class="w-4 h-4 shrink-0" style="color: var(--crb-blue-color)"></i>
            <span class="text-[12px] truncate" style="color: var(--crb-blue-color)"
                  x-text="'Up next: ' + (status.pendingControlDescription || status.pendingActionDescription || 'action')"></span>
        </div>
    </template>

    <!-- Running (an action was just unblocked and is executing) -->
    <template x-if="!autoRunning && !finished && !isWaitingForNext">
        <div class="flex-1 min-w-0 flex items-center gap-2 px-3 py-2 rounded-xl"
             style="background: color-mix(in srgb, var(--crb-blue-color) 6%, transparent)">
            <i data-lucide="loader-2" class="w-4 h-4 shrink-0 v2-exe-spin-limited" style="color: var(--crb-blue-color)"></i>
            <span class="text-[12px]" style="color: var(--crb-blue-color)">Running action...</span>
        </div>
    </template>

    <!-- Finished -->
    <template x-if="finished">
        <div class="flex-1 min-w-0 flex items-center gap-2 px-3 py-2 rounded-xl"
             style="background: color-mix(in srgb, var(--crb-grey-color) 8%, transparent)">
            <i data-lucide="flag" class="w-4 h-4 shrink-0" style="color: var(--crb-grey-color)"></i>
            <span class="text-[12px]" style="color: var(--crb-grey-color)"
                  x-text="sessionExpired ? 'Session expired (idle timeout) — redirecting to the execution report...' : 'Debug session finished — redirecting to the execution report...'"></span>
        </div>
    </template>

    <!-- Controls -->
    <div class="flex items-center gap-2 shrink-0">
        <template x-if="status.pendingFailed">
            <button @click="retry()" :disabled="busy || finished || !isWaitingForNext || autoRunning"
                    class="v2-header-action-btn" style="background: var(--crb-red-color, #e63757)"
                    data-tip="Re-run the failed action/control (reloads it fresh, so an edit made elsewhere is picked up)">
                <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
                Retry
            </button>
        </template>
        <button @click="next()" :disabled="busy || finished || !isWaitingForNext || autoRunning"
                class="v2-header-action-btn" style="background: var(--crb-blue-color)"
                :data-tip="status.pendingFailed ? 'Accept the failure and move to the next action' : 'Run the next action'">
            <i data-lucide="step-forward" class="w-3.5 h-3.5"></i>
            Next
        </button>
        <button @click="stop()" :disabled="busy || finished"
                class="v2-header-action-btn" style="background: var(--crb-red-color, #e63757)"
                data-tip="Stop the debug session">
            <i data-lucide="square" class="w-3.5 h-3.5"></i>
            Stop
        </button>
    </div>
</div>

<template x-if="errorMessage">
    <div class="mb-3 px-4 py-2.5 rounded-xl text-[12px] v2-fade-in"
         style="background: color-mix(in srgb, var(--crb-red-color) 8%, transparent); color: var(--crb-red-color)"
         x-text="errorMessage"></div>
</template>
