<!-- Widget radar: view and settings (the card, its header and its common settings are in MyMonitor.jsp) -->
<div class="mm-loader" x-show="loading" x-cloak><span class="mm-spinner"></span></div>
<div x-show="!cfg" class="mm-chartwidget">
    <div class="mm-empty" x-show="!ready" x-text="t('picktestcases')"></div>
    <div class="mm-empty" x-show="ready && error" x-text="error"></div>
    <div class="mm-empty" x-show="ready && !error && !loading && !hasData" x-text="t('nodata')"></div>

    <div class="mm-chartwidget" x-show="ready && !error && hasData">
        <div class="flex items-end justify-between gap-3 flex-wrap">
            <span class="mm-sub" x-text="metricLabel(metric) + ' / ' + splitLabel(split)"></span>
            <span class="mm-empty" x-show="!enough" x-text="t('needthree')"></span>
        </div>
        <div class="mm-chart" x-ref="chart" x-html="svg"></div>
    </div>
</div>

<div x-show="cfg" class="mm-field-list">
    <!-- 1. The data -->
    <div class="mm-field">
        <span class="v2in-fieldlabel" x-text="t('datatype')"></span>
        <select class="v2in-input" @change="pickSource($event.target.value)">
            <template x-for="s in sources" :key="s">
                <option :value="s" :selected="s === w.source" x-text="sourceLabel(s)"></option>
            </template>
        </select>
    </div>
    <!-- 2. The information -->
    <div class="mm-field">
        <span class="v2in-fieldlabel" x-text="t('information')"></span>
        <select class="v2in-input" @change="w.metric = $event.target.value">
            <template x-for="k in metrics" :key="k">
                <option :value="k" :selected="k === metric" x-text="metricLabel(k)"></option>
            </template>
        </select>
    </div>
    <!-- 3. The split -->
    <div class="mm-field">
        <span class="v2in-fieldlabel" x-text="t('dimension')"></span>
        <select class="v2in-input" @change="w.split = $event.target.value">
            <template x-for="k in splits" :key="k">
                <option :value="k" :selected="k === split" x-text="splitLabel(k)"></option>
            </template>
        </select>
    </div>
    <!-- 4. The filters: the test folders / test cases to keep -->
    <div class="mm-field" x-show="hasFilters">
        <span class="v2in-fieldlabel" x-text="needsTestCase ? t('filtertestcases') : t('filtertests')"></span>
        <div class="flex flex-wrap gap-1.5" x-show="w.filters.length">
            <template x-for="(f, i) in w.filters" :key="filterLabel(f)">
                <span class="v2in-chip"><span x-text="filterLabel(f)"></span>
                    <button type="button" class="ml-1" @click="removeFilter(i)" :title="t('removewidget')">&times;</button></span>
            </template>
        </div>
        <div class="flex gap-1.5 items-center">
            <select class="v2in-input flex-1" @change="pickPending($event.target.value)">
                <option value="" x-text="t('choosetest')"></option>
                <template x-for="x in tests" :key="x">
                    <option :value="x" :selected="x === pendTest" x-text="x"></option>
                </template>
            </select>
            <select class="v2in-input flex-1" x-show="needsTestCase" :disabled="!pendTest" @change="pendCase = $event.target.value">
                <option value="" x-text="t('choosetestcase')"></option>
                <template x-for="x in testcases" :key="x">
                    <option :value="x" :selected="x === pendCase" x-text="x"></option>
                </template>
            </select>
            <button type="button" class="v2in-btn v2in-btn--xs" :disabled="!canAdd()" @click="addFilter()" x-text="t('addfilter')"></button>
        </div>
    </div>
</div>
