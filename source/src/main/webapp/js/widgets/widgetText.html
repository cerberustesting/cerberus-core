<!-- Widget text: view and settings (the card, its header and its common settings are in MyMonitor.jsp) -->
<div x-show="!cfg" class="mm-text" x-text="w.content || t('textempty')" :class="w.content ? '' : 'mm-empty'"></div>

<div x-show="cfg" class="mm-field">
    <span class="v2in-fieldlabel" x-text="t('content')"></span>
    <textarea class="v2in-input" rows="4" x-model="w.content"></textarea>
</div>
