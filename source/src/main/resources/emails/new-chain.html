<!DOCTYPE html>
<!-- New chain executed email. Variables : see EmailGenerationService. -->

<body>
<th:block th:fragment="content">
  <p>
    A new chain <b th:text="${chain}">chain</b> has been executed in <b th:text="${environment}">env</b>

  <p>Please perform your necessary tests following that execution.</p>
</th:block>
</body>
</html>
