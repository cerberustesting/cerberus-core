<!DOCTYPE html>
<!-- Forgot password email. Variables : see EmailGenerationService. -->
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{components/layout :: layout(~{::content})}">
<body>
<th:block th:fragment="content">
  <p>Hello <b th:text="${name}">Name</b>,</p>
  <p>We have received a request to reset your password.</p>
  <p><a th:replace="~{components/fragments :: button(${linkUrl}, 'Reset your password')}"></a></p>
  <p style="color:#888888;font-size:12px;">If you did not request a password reset, just ignore this email : your current password will continue to work.</p>
</th:block>
</body>
</html>
